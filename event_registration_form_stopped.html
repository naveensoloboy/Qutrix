<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closed | QUTRIX 2K26</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #020617; 
            --accent: #71e4e4; /* Sky Blue Accent */
            --accent-gold: #fbbf24;
            --text-gray: #94a3b8;
            --white: #ffffff;
            --card-bg: rgba(15, 23, 42, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            overflow: hidden;
            position: relative;
        }

        /* Animated Geometric Background */
        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.4;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--accent);
            animation: float 20s infinite alternate;
        }

        .shape-1 { width: 300px; height: 300px; top: -100px; left: -50px; background: var(--accent); }
        .shape-2 { width: 400px; height: 400px; bottom: -150px; right: -50px; background: var(--accent-gold); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        /* Main Card */
        .status-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: clamp(30px, 6vw, 60px);
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Circular Icon Header */
        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            color: var(--accent);
            font-size: 2rem;
            box-shadow: inset 0 0 20px rgba(113, 228, 228, 0.1);
        }

        .status-card h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            letter-spacing: -1px;
            margin-bottom: 15px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card p {
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        /* Modern Gradient Button */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary);
            background: linear-gradient(135deg, var(--accent), #4fd1d1);
            padding: 16px 40px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-home:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 30px rgba(113, 228, 228, 0.3);
            filter: brightness(1.1);
        }

        .btn-home i { transition: 0.3s; }
        .btn-home:hover i { transform: translateX(-5px); }

        .tag {
            background: rgba(251, 191, 36, 0.1);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="status-card">
        <div class="icon-circle">
            <i class="fas fa-calendar-times"></i>
        </div>
        
        <div class="tag">CAPACITY REACHED</div>
        
        <h1>Registration <br>is Closed</h1>
        
        <p>The portal for <b>QUTRIX 2K26</b> has officially ceased operations. We look forward to seeing the registered participants on the day of the event.</p>
        
        <a href="index.html" class="btn-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

</body>
</html>
