<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QUTRIX Gallery | GASC</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --accent: #fbbf24;
            --accent-glow: rgba(251, 191, 36, 0.4);
            --bg-dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Neural Background Canvas */
        #systemCanvas {
            position: fixed;
            top: 0; left: 0; z-index: -1;
        }

        /* Header Styling */
        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .department-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .qutrix {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* Slideshow container */
        .slideshow-container {
            max-width: 900px;
            width: 100%;
            height: 500px;
            position: relative;
            margin: auto;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            background: #000;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 20px rgba(251, 191, 36, 0.1);
        }

        .mySlides {
            display: none;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Ken Burns Effect (Subtle Zoom) */
        .mySlides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 4s ease-out;
            filter: brightness(0.8);
        }

        .active-slide img {
            transform: scale(1.1);
        }

        /* Caption text */
        .text {
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 20px;
            padding: 20px;
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: left;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            border-bottom: 4px solid var(--accent);
        }

        /* Number text */
        .numbertext {
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 12px 20px;
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--accent);
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        /* Buttons */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            transition: 0.3s;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        .prev { left: 20px; }
        .next { right: 20px; }

        .prev:hover, .next:hover {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Dots */
        .dot-container {
            text-align: center;
            margin-top: 25px;
        }

        .dot {
            height: 6px;
            width: 30px;
            margin: 0 5px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: inline-block;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .active {
            background-color: var(--accent);
            width: 50px;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        @media (max-width: 768px) {
            .slideshow-container { height: 300px; }
            .qutrix { font-size: 1.8rem; }
            .prev, .next { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <canvas id="systemCanvas"></canvas>

    <div class="header">
        <div class="department-name">PG & Research Department of Computer Science</div>
        <div class="qutrix">Event Gallery</div>
    </div>

    <div class="slideshow-container">

        <div class="mySlides">
            <div class="numbertext">01 / 06</div>
            <img src="images/gallery/DSC_7805.JPG" alt="Inaugural Function">
            <div class="text">Inaugural Ceremony</div>
        </div>

        <div class="mySlides">
            <div class="numbertext">02 / 06</div>
            <img src="images/gallery/DSC_7811.JPG" alt="Inaugural Function">
            <div class="text">Lamp Lighting Ceremony</div>
        </div>

        <div class="mySlides">
            <div class="numbertext">03 / 06</div>
            <img src="images/gallery/DSC_8119.JPG" alt="Software Contest">
            <div class="text">Software Development Contest</div>
        </div>

        <div class="mySlides">
            <div class="numbertext">04 / 06</div>
            <img src="images/gallery/DSC_8199.JPG" alt="Honor the Judge">
            <div class="text">Felicitation of Distinguished Judges</div>
        </div>

        <div class="mySlides">
            <div class="numbertext">05 / 06</div>
            <img src="images/gallery/DSC_8104.JPG" alt="Honor the Judge">
            <div class="text">Expert Panel Review</div>
        </div>

        <div class="mySlides">
            <div class="numbertext">06 / 06</div>
            <img src="images/gallery/DSC_8324.JPG" alt="Valedictory Function">
            <div class="text">Valedictory & Prize Distribution</div>
        </div>

        <a class="prev" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></a>
        <a class="next" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></a>

    </div>

    <div class="dot-container">
        <span class="dot" onclick="currentSlide(1)"></span> 
        <span class="dot" onclick="currentSlide(2)"></span> 
        <span class="dot" onclick="currentSlide(3)"></span> 
        <span class="dot" onclick="currentSlide(4)"></span> 
        <span class="dot" onclick="currentSlide(5)"></span> 
        <span class="dot" onclick="currentSlide(6)"></span> 
    </div>

    <script>
        let slideIndex = 1;
let autoSlideTimeout;

function showSlides(n) {
    let i;
    let slides = document.getElementsByClassName("mySlides");
    let dots = document.getElementsByClassName("dot");

    if (n > slides.length) { slideIndex = 1 }
    if (n < 1) { slideIndex = slides.length }

    // 1. Reset all slides
    for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
        slides[i].classList.remove("active-slide");
    }

    // 2. Reset all dots
    for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active", "");
    }

    // 3. Target the current slide and its image
    let currentSlideElem = slides[slideIndex - 1];
    let img = currentSlideElem.getElementsByTagName('img')[0];

    // 4. DISPLAY LOGIC: Wait for image to load
    currentSlideElem.style.display = "block";
    dots[slideIndex - 1].className += " active";

    const startAnimation = () => {
        currentSlideElem.classList.add("active-slide");
        // Start the timer ONLY after the image is ready and animation begins
        clearTimeout(autoSlideTimeout);
        autoSlideTimeout = setTimeout(() => changeSlide(1), 5000); 
    };

    if (img.complete) {
        // If image is already cached/loaded
        startAnimation();
    } else {
        // If image is still downloading, wait for it
        img.onload = startAnimation;
    }
}

function changeSlide(n) {
    // Clear timeout immediately on manual click to prevent double jumping
    clearTimeout(autoSlideTimeout);
    showSlides(slideIndex += n);
}

function currentSlide(n) {
    clearTimeout(autoSlideTimeout);
    showSlides(slideIndex = n);
}

// --- Background Canvas (Neural Network) ---
const canvas = document.getElementById('systemCanvas');
const ctx = canvas.getContext('2d');
let points = [];

function initCanvas() {
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight;
    points = [];
    for (let i = 0; i < 40; i++) {
        points.push({ 
            x: Math.random() * canvas.width, 
            y: Math.random() * canvas.height, 
            vx: (Math.random() - 0.5) * 0.3, 
            vy: (Math.random() - 0.5) * 0.3 
        });
    }
}

function drawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(251, 191, 36, 0.2)"; 
    ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
    points.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1; 
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI * 2); ctx.fill();
        for (let j = i + 1; j < points.length; j++) {
            const d = Math.hypot(p.x - points[j].x, p.y - points[j].y);
            if (d < 180) { 
                ctx.beginPath(); ctx.moveTo(p.x, p.y); 
                ctx.lineTo(points[j].x, points[j].y); ctx.stroke(); 
            }
        }
    });
    requestAnimationFrame(drawCanvas);
}

initCanvas(); 
drawCanvas(); 
window.onresize = initCanvas;

// Initial call
window.onload = () => showSlides(slideIndex);
    </script>

</body>
</html>
