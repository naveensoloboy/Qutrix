    /* --- CSS VARIABLES: QUTRIX 2K26 PALETTE --- */
    :root {
        --primary: #020617; 
        --accent: #fbbf24;  
        --accent-glow: rgba(251, 191, 36, 0.3);
        --text-gray: #94a3b8;
        --glass: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.1);
        --white: #ffffff;
        --skyblu: #71e4e4;
    }

    /* --- RESET & GLOBAL STYLES --- */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
        background-color: var(--primary);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(113, 228, 228, 0.05) 0%, transparent 20%),
            radial-gradient(circle at 90% 80%, rgba(251, 191, 36, 0.05) 0%, transparent 20%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: clamp(10px, 4vw, 20px);
        color: var(--white);
        overflow-x: hidden;
    }

    /* --- FORM CONTAINER --- */
    .feedback-form {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: clamp(20px, 5vw, 40px);
        border-radius: 24px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 650px;
        animation: slideUp 0.8s cubic-bezier(0.19, 1, 0.22, 1);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(24px, 5vw, 32px);
        color: var(--white);
        text-align: center;
        font-weight: 800;
        margin-bottom: 8px;
    }

    h3 {
        font-size: 13px;
        color: var(--text-gray);
        text-align: center;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 35px;
    }

    /* --- FORM GROUPS & INPUTS --- */
    .form-group {
        margin-bottom: 25px;
        width: 100%;
    }

    .form-group label {
        display: block;
        margin-bottom: 12px;
        font-weight: 600;
        font-size: 14px;
        color: var(--skyblu);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .feedback-form textarea,
    .feedback-form input[type="text"] {
        width: 100%;
        padding: 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        font-size: 16px;
        color: var(--white);
        transition: all 0.3s ease;
        outline: none;
    }

    .feedback-form textarea { min-height: 100px; resize: vertical; }

    .feedback-form textarea:focus,
    .feedback-form input[type="text"]:focus {
        border-color: var(--accent);
        background: rgba(251, 191, 36, 0.05);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    /* --- RADIO GRID (RESPONSIVE) --- */
    .radio-options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .radio-options label {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        padding: 12px 15px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: var(--text-gray);
        transition: 0.3s;
        margin-bottom: 0;
    }

    .radio-options input[type="radio"] {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .radio-options label:hover {
        border-color: var(--skyblu);
        background: rgba(113, 228, 228, 0.05);
    }

    .radio-options input[type="radio"]:checked + span {
        color: var(--accent);
        font-weight: 700;
    }

    /* --- SUBMIT BUTTON --- */
    button[type="submit"] {
        width: 100%;
        padding: 18px;
        background: var(--accent);
        color: var(--primary);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 2px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        margin-top: 15px;
    }

    button[type="submit"]:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px var(--accent-glow);
        filter: brightness(1.1);
    }

    /* --- FULL SELECT2 RESPONSIVE OVERRIDES --- */
    .select2-container {
        width: 100% !important;
        margin-bottom: 10px;
    }

    .select2-container--default .select2-selection--single {
        background-color: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid var(--glass-border) !important;
        border-radius: 12px !important;
        height: 52px !important;
        display: flex;
        align-items: center;
        transition: all 0.3s ease;
    }

    /* Fix text overflow when long college name is selected */
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        color: var(--white) !important;
        padding-left: 15px !important;
        padding-right: 35px !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
        line-height: 50px;
    }

    /* The arrow icon */
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 50px !important;
        right: 10px !important;
    }

    /* Glow effect on focus */
    .select2-container--default.select2-container--open .select2-selection--single,
    .select2-container--default.select2-container--focus .select2-selection--single {
        border-color: var(--accent) !important;
        box-shadow: 0 0 15px var(--accent-glow) !important;
    }

    /* Dropdown Panel */
    .select2-dropdown {
        background-color: #0f172a !important;
        border: 1px solid var(--accent) !important;
        border-radius: 12px !important;
        z-index: 9999;
        overflow: hidden;
    }

    .select2-search__field {
        background-color: var(--primary) !important;
        color: white !important;
        border: 1px solid var(--glass-border) !important;
        border-radius: 8px !important;
    }

    .select2-results__option--highlighted[aria-selected] {
        background-color: var(--accent) !important;
        color: var(--primary) !important;
    }

    /* --- MOBILE BREAKPOINTS --- */
    @media (max-width: 600px) {
        .radio-options {
            grid-template-columns: 1fr; /* Stack ratings on mobile */
        }
        
        .feedback-form {
            padding: 25px 20px;
        }

        h2 { font-size: 24px; }
        
        .select2-container--default .select2-selection--single {
            height: 48px !important;
        }
    }
